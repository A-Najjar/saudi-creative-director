<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1C18"/>
      <stop offset="1" stop-color="#1B2E27"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#D9B26F" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- top accent line -->
  <rect x="540" y="78" width="200" height="4" rx="2" fill="#D9B26F"/>

  <text x="640" y="182" text-anchor="middle" font-family="Noto Kufi Arabic" font-weight="800" font-size="84" fill="#F5EBDD">المدير الإبداعي السعودي</text>
  <text x="640" y="280" text-anchor="middle" font-family="DejaVu Sans" font-size="30" fill="#D9B26F" letter-spacing="3">SAUDI CREATIVE DIRECTOR · A CLAUDE SKILL</text>

  <text x="640" y="345" text-anchor="middle" font-family="IBM Plex Sans Arabic" font-weight="700" font-size="30" fill="#C9D3CE">إنسايت محلي  ·  تقييم مقفل بالدليل  ·  فحص امتثال سعودي</text>

  <!-- stage chips, right to left order -->
  <g font-family="IBM Plex Sans Arabic" font-weight="700" font-size="26" text-anchor="middle">
    <g transform="translate(1078,440)"><rect x="-80" y="-34" width="160" height="60" rx="30" fill="#D9B26F"/><text y="6" fill="#0F1C18">١ استلام</text></g>
    <g transform="translate(903,440)"><rect x="-80" y="-34" width="160" height="60" rx="30" fill="none" stroke="#D9B26F" stroke-width="2"/><text y="6" fill="#F5EBDD">٢ إنسايت</text></g>
    <g transform="translate(728,440)"><rect x="-80" y="-34" width="160" height="60" rx="30" fill="none" stroke="#D9B26F" stroke-width="2"/><text y="6" fill="#F5EBDD">٣ توليد</text></g>
    <g transform="translate(553,440)"><rect x="-80" y="-34" width="160" height="60" rx="30" fill="none" stroke="#D9B26F" stroke-width="2"/><text y="6" fill="#F5EBDD">٤ تقييم</text></g>
    <g transform="translate(378,440)"><rect x="-80" y="-34" width="160" height="60" rx="30" fill="none" stroke="#D9B26F" stroke-width="2"/><text y="6" fill="#F5EBDD">٥ تحسين</text></g>
    <g transform="translate(203,440)"><rect x="-80" y="-34" width="160" height="60" rx="30" fill="#D9B26F"/><text y="6" fill="#0F1C18">٦ عرض</text></g>
  </g>

  <text x="640" y="560" text-anchor="middle" font-family="IBM Plex Sans Arabic" font-weight="700" font-size="24" fill="#8FA39A">سوابق سعودية موثقة من دبي لينكس وكان وإفي</text>
</svg>
